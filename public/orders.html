<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Tracking — NovaTech Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">⚡</div>
        <span>NovaTech</span>
      </a>

      <div class="nav-actions">
        <a href="/" class="nav-link">Catalog</a>
        <a href="/orders.html" class="nav-link active">Orders</a>
        <div id="userNavArea"></div>
        <button class="cart-btn open-cart-drawer" id="headerCartBtn">
          <span>🛒 Cart</span>
          <span class="cart-badge" id="cartBadgeCount" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="store-container" style="margin-top: 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem;">My Orders & History</h1>
        <p style="color: var(--text-secondary);">Track your recent shipments, receipts, and order processing status.</p>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <input type="text" id="orderLookupInput" class="form-control" placeholder="Lookup Order # (e.g. CA-...)" style="width: 260px;">
        <button class="btn btn-secondary btn-sm" id="lookupBtn">Track</button>
      </div>
    </div>

    <!-- Orders Container -->
    <div id="ordersList">
      <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
        Loading order records...
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div class="brand-icon" style="width: 32px; height: 32px; font-size: 1rem;">⚡</div>
        <span style="font-weight: 700; color: #fff;">NovaTech Store</span>
        <span style="color: var(--text-muted);">| Task 1 E-commerce Store</span>
      </div>
      <div>HTML5, CSS3, Vanilla JS & Express.js</div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    async function loadOrders() {
      const container = document.getElementById('ordersList');

      if (!Auth.isLoggedIn()) {
        container.innerHTML = `
          <div style="text-align: center; padding: 4rem 1.5rem; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
            <h2 style="font-size: 1.4rem; margin-bottom: 0.5rem;">Sign In to View Your Orders</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Please log in with your customer account to see your personal purchase history.</p>
            <button class="btn btn-primary" onclick="Auth.showModal()">Sign In with Account</button>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch('/api/orders/my-orders', {
          headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
        });
        if (!res.ok) throw new Error('Failed to load orders');
        const orders = await res.json();

        if (orders.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 4rem 1.5rem; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
              <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
              <h2 style="font-size: 1.4rem; margin-bottom: 0.5rem;">No Orders Yet</h2>
              <p style="color: var(--text-muted); margin-bottom: 1.5rem;">You haven't placed any orders with this account yet.</p>
              <a href="/" class="btn btn-primary">Browse Store Catalog</a>
            </div>
          `;
          return;
        }

        renderOrdersList(orders);
      } catch (err) {
        container.innerHTML = `<div style="color: var(--danger); text-align: center; padding: 2rem;">${err.message}</div>`;
      }
    }

    function renderOrdersList(orders) {
      const container = document.getElementById('ordersList');
      container.innerHTML = orders.map(order => `
        <div class="order-card">
          <div class="order-card-header">
            <div>
              <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Order Number</span>
              <div style="font-weight: 800; font-size: 1.1rem; color: #a5b4fc;">${order.order_number}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem;">
                Placed on ${new Date(order.created_at).toLocaleString()}
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 1rem;">
              <span class="order-badge">● ${order.status || 'Confirmed'}</span>
              <div style="text-align: right;">
                <div style="font-size: 0.8rem; color: var(--text-muted);">Total Amount</div>
                <div style="font-weight: 800; font-size: 1.25rem; color: #fff;">$${order.total_amount.toFixed(2)}</div>
              </div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem;">
            ${(order.items || []).map(item => `
              <div style="display: flex; align-items: center; gap: 1rem; background: rgba(255, 255, 255, 0.02); padding: 0.75rem; border-radius: var(--radius-sm);">
                <img src="${item.product_image || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=200'}" alt="${item.product_name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: var(--radius-sm);">
                <div style="flex: 1;">
                  <div style="font-weight: 600; font-size: 0.92rem;">${item.product_name}</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Qty: ${item.quantity} × $${item.price.toFixed(2)}</div>
                </div>
                <div style="font-weight: 700;">$${(item.quantity * item.price).toFixed(2)}</div>
              </div>
            `).join('')}
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 0.9rem; flex-wrap: wrap; gap: 0.5rem;">
            <div>
              📍 Delivery to: <strong>${order.customer_name}</strong> — ${order.address}, ${order.city} (${order.postal_code})
            </div>
            <div>
              Payment: <strong>${order.payment_method}</strong>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function lookupOrder() {
      const input = document.getElementById('orderLookupInput');
      const orderNum = input.value.trim();
      if (!orderNum) {
        Toast.show('Please enter an order number', 'error');
        return;
      }

      try {
        const res = await fetch(`/api/orders/${encodeURIComponent(orderNum)}`);
        if (!res.ok) throw new Error('Order not found with that number');
        const order = await res.json();
        renderOrdersList([order]);
        Toast.show(`Found order ${orderNum}`, 'success');
      } catch (err) {
        Toast.show(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      Cart.initDrawer();
      Auth.init();
      loadOrders();

      document.getElementById('lookupBtn').addEventListener('click', lookupOrder);
      document.getElementById('orderLookupInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') lookupOrder();
      });

      window.addEventListener('auth-changed', () => loadOrders());
    });
  </script>
</body>
</html>
